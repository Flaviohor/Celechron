name: Build Desktop Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows-x64:
    name: "Windows x64"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows x64
        run: flutter build windows --release

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  build-windows-arm64:
    name: "Windows arm64"
    runs-on: windows-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows arm64
        run: flutter build windows --release

      - name: Upload Windows arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-windows-arm64
          path: build/windows/arm64/runner/Release/
          if-no-files-found: error

  build-windows-x86:
    name: "Windows x86"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows x86
        shell: pwsh
        run: |
          # flutter build windows builds for host arch (x64).
          # For x86, we need to manually run cmake with Win32 platform.
          # First, run flutter build to generate ephemeral files
          flutter build windows --release

          # Find VS installation
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $cmakePath = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"

          # Reconfigure cmake for Win32
          $buildDir = "build\windows\x64"
          & $cmakePath -G "Visual Studio 17 2022" -A Win32 -S windows -B "$buildDir" -DFLUTTER_TARGET="lib\main.dart"

          # Rebuild
          & $cmakePath --build "$buildDir" --config Release

      - name: Upload Windows x86 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-windows-x86
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  build-macos:
    name: "macOS"
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-macos
          path: build/macos/Build/Products/Release/
          if-no-files-found: error

  build-linux:
    name: "Linux"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-linux-x64
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
