name: Build Desktop Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: "Windows ${{ matrix.arch }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: arm64
          - arch: x86
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows x64
        if: matrix.arch == 'x64'
        run: flutter build windows --release

      - name: Build Windows arm64
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          # Run flutter build once to set up ephemeral files
          flutter build windows --release

          # Reconfigure for ARM64 and rebuild
          $buildDir = "build\windows\x64"
          $arm64Dir = "build\windows\arm64"
          New-Item -ItemType Directory -Force -Path $arm64Dir | Out-Null

          # Copy ephemeral files
          Copy-Item -Recurse "windows\flutter\ephemeral" "$arm64Dir\flutter\ephemeral"

          # Find VS installation
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath

          # Use MSBuild to rebuild for ARM64
          $msbuild = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild "$buildDir\runner\celechron.sln" /p:Configuration=Release /p:Platform=ARM64 /t:Rebuild

      - name: Build Windows x86
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          # Run flutter build once to set up ephemeral files
          flutter build windows --release

          # Use MSBuild to rebuild for x86
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath

          $msbuild = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild "build\windows\x64\runner\celechron.sln" /p:Configuration=Release /p:Platform=Win32 /t:Rebuild

      - name: Upload Windows ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-windows-${{ matrix.arch }}
          path: build/windows/*/runner/Release/
          if-no-files-found: error

  build-macos:
    name: "macOS"
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-macos
          path: build/macos/Build/Products/Release/
          if-no-files-found: error

  build-linux:
    name: "Linux"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-linux-x64
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
