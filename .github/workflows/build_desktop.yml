name: Build Desktop Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows-x64:
    name: "Windows x64"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows x64
        run: flutter build windows --release

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  build-windows-arm64:
    name: "Windows arm64"
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          architecture: x64

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows arm64
        run: flutter build windows --release -v

      - name: Upload Windows arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-windows-arm64
          path: build/windows/arm64/runner/Release/
          if-no-files-found: error

  build-windows-x86:
    name: "Windows x86"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows x86
        shell: pwsh
        run: |
          flutter build windows --release

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $cmakePath = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"

          $buildDir = "build\windows\x64"
          & $cmakePath -G "Visual Studio 17 2022" -A Win32 -S windows -B "$buildDir" -DFLUTTER_TARGET="lib\main.dart"
          & $cmakePath --build "$buildDir" --config Release

      - name: Upload Windows x86 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-windows-x86
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  build-macos:
    name: "macOS"
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-macos
          path: build/macos/Build/Products/Release/
          if-no-files-found: error

  build-linux-x64:
    name: "Linux x64"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-linux-x64
          path: build/linux/x64/release/bundle/
          if-no-files-found: error

  build-linux-arm64:
    name: "Linux arm64"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Linux arm64 in Docker
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            arm64v8/ubuntu:22.04 \
            bash -c "
              apt-get update && \
              apt-get install -y curl git unzip xz-utils zip ninja-build \
                libgtk-3-dev libsecret-1-dev clang cmake pkg-config \
                liblzma-dev libstdc++-12-dev && \
              rm -rf /var/lib/apt/lists/* && \
              git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /opt/flutter && \
              export PATH=/opt/flutter/bin:/opt/flutter/bin/cache/dart-sdk/bin:\$PATH && \
              flutter precache --linux && \
              flutter config --enable-linux-desktop && \
              flutter pub get && \
              flutter build linux --release
            "

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: celechron-linux-arm64
          path: build/linux/arm64/release/bundle/
          if-no-files-found: error
